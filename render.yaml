# Render Blueprint for MoneyQuest (Render dashboard → New → Blueprint → pick this repository).
# Uses a paid "starter" instance with a 1 GB disk so family backups, device links and classes survive
# restarts and deploys. For a partner build, change VITE_EDITION (e.g. abc-bank) and redeploy.
services:
  - type: web
    name: moneyquest
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_FILE
        value: /var/data/moneyquest.db
      - key: VITE_EDITION
        value: standard
    disk:
      name: moneyquest-data
      mountPath: /var/data
      sizeGB: 1
